schema_version: 1

context:
  name: check-jsonschema
  version: "0.39.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/check_jsonschema-${{ version }}.tar.gz
  sha256: 33340a2f885e207411c7a7d1db0a052ba24a4e58c92a47f54231e4a128af2764

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - check-jsonschema = check_jsonschema:main

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.12.0
    - pip
  run:
    - python >=${{ python_min }}
    - ruamel.yaml >=0.18.10,<0.20.0
    - jsonschema >=4.18.0,<5.0
    - regress >=2024.11.1
    - requests <3.0
    - click >=8.5,<9

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check
      - check-jsonschema --help

about:
  summary: A jsonschema CLI and pre-commit hook
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/python-jsonschema/check-jsonschema

extra:
  recipe-maintainers:
    - freundTech
